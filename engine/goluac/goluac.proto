syntax = "proto3";
package goluac;
option go_package = "github.com/kercylan98/minotaur/engine/goluac";

// LuaMessage 是用于和 Goluac 交互的消息包装，当需要发送该类型消息时，请使用 NewLuaMessage 函数进行创建
message LuaMessage {
  string name = 1; // 消息名
  bytes data = 2; // 消息数据
  bool from_lua = 3; // 是否是 Lua 发送的消息（擅自设置或更改该值，可能导致不可预的后果）
  bool from_lua_reply = 4; // 是否是 Lua 回复的消息（擅自设置或更改该值，可能导致不可预的后果）
}